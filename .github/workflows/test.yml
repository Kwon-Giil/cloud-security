name: CI Test Workflow

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test-job:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 소스코드 내려받기
        uses: actions/checkout@v7

      # 🌟 [신규 추가] 도커 이미지 빌드(포장) 사전 검증
      - name: 2. 도커 이미지 빌드
        run: docker compose build

      - name: 3. 컨테이너 실행
        run: docker compose up -d

      - name: 4. 헬스 체크 (서버 포트 응답 확인)
        run: |
          sleep 3
          curl -f http://localhost:8080